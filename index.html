<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Spot Error Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <style type="text/tailwindcss">
        @layer utilities {
          /* Add sr-only if not fully covered by CDN */
          .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
          }
        }
        /* Define custom animation for shake */
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
          20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
          animation: shake 0.4s ease-in-out;
        }
        /* Custom focus visible for word spans (more noticeable) */
        .word:focus-visible {
            outline: 2px solid #3b82f6; /* blue-500 */
            outline-offset: 2px;
            background-color: #e0f2fe; /* sky-100 */
        }
    </style>
    <script>
      // Optional: Configure Tailwind theme (e.g., for Shadcn-like button)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Approximation of Shadcn UI default button colors
              primary: {
                DEFAULT: 'hsl(222.2 47.4% 11.2%)', // bg-primary
                foreground: 'hsl(210 40% 98%)',    // text-primary-foreground
              },
              // Accent colors from the prompt
              'feedback-correct': '#16A34A', // green-600/700
              'feedback-wrong': '#DC2626', // red-600/700
              'feedback-pending': '#FACC15', // yellow-400
              'card-bg': '#F8FAFC', // slate-50
            },
          }
        }
      }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <!-- Grammar Card Container -->
    <div id="grammar-card"
         class="bg-card-bg rounded-2xl shadow-md p-4 w-full max-w-md mx-auto flex flex-col gap-4 transition-shadow duration-200"
         role="group"
         aria-labelledby="sentence-heading">

        <!-- Screen Reader Only Heading -->
        <h2 id="sentence-heading" class="sr-only">Grammar Spot the Error Card</h2>

        <!-- Sentence Area -->
        <div id="sentence-container" class="text-lg leading-relaxed text-slate-800 text-center">
            <!-- Words will be dynamically inserted here -->
            <span class="opacity-50">Loading sentence...</span>
        </div>

        <!-- Action Button Area -->
        <div class="flex justify-center mt-2">
            <button id="show-answer-btn"
                    type="button"
                    disabled
                    class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
                    aria-controls="answer-details">
                Show Answer
            </button>
        </div>

        <!-- Revealed Answer Section (Initially Hidden) -->
        <div id="answer-details" class="mt-2 pt-3 border-t border-slate-200 text-center text-sm hidden">
            <p id="answer-status" class="font-semibold text-base mb-1"></p>
            <p id="answer-text" class="mb-1"></p>
            <p id="answer-rule" class="text-slate-600 italic"></p>
            <p id="next-prompt" class="mt-3 text-xs text-slate-500 hidden">Tap anywhere on the card to continue.</p>
        </div>

        <!-- ARIA Live Region for Screen Reader Feedback -->
        <div id="sr-feedback" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    </div>

    <script>
        // --- Card Data ---
        // You would typically fetch this data or pass it in
        const cardData = {
          id: 1, // Example ID
          sentence: "My cousins is coming tomorrow.",
          errorIndex: 2, // ZERO-based index of "is"
          correction: "are",
          rule: "plural subject → plural verb",
          // Placeholder for a function to load the next card
          onNext: () => {
            console.log("Next card requested!");
            // In a real app, you'd load new data here and call initCard again
            alert("Next card would load now.");
            // Example: Load new data and re-initialize
            // loadNextCardData().then(newCardData => initCard(newCardData));
          }
        };

        // --- DOM Element References ---
        const cardElement = document.getElementById('grammar-card');
        const sentenceContainer = document.getElementById('sentence-container');
        const showAnswerBtn = document.getElementById('show-answer-btn');
        const answerDetails = document.getElementById('answer-details');
        const answerStatus = document.getElementById('answer-status');
        const answerText = document.getElementById('answer-text');
        const answerRule = document.getElementById('answer-rule');
        const nextPrompt = document.getElementById('next-prompt');
        const srFeedback = document.getElementById('sr-feedback');

        // --- State Variables ---
        let words = [];
        let currentErrorIndex = -1;
        let currentCorrection = '';
        let currentRule = '';
        let currentOnNext = null;
        let selectedWordIndex = null;
        let isRevealed = false;

        // --- Functions ---

        function announceFeedback(message) {
            // Clear previous message content before adding new
            srFeedback.textContent = '';
            // Set new message - timeout helps ensure it's read reliably
            setTimeout(() => {
                srFeedback.textContent = message;
            }, 50); // Small delay
        }

        function deselectWord() {
            if (selectedWordIndex !== null && !isRevealed) {
                const wordSpans = sentenceContainer.querySelectorAll('.word');
                const previouslySelected = wordSpans[selectedWordIndex];
                if (previouslySelected) {
                    previouslySelected.classList.remove('bg-yellow-300/80', 'hover:bg-yellow-400/80');
                    previouslySelected.classList.add('hover:bg-slate-200');
                    previouslySelected.setAttribute('aria-pressed', 'false');
                }
                selectedWordIndex = null;
                showAnswerBtn.disabled = true;
                showAnswerBtn.setAttribute('aria-disabled', 'true');
                announceFeedback('Selection cleared.');
            }
        }

        function handleWordInteraction(index, wordText) {
            if (isRevealed) return; // Don't allow selection after reveal

            // Deselect previous word if any
            if (selectedWordIndex !== null && selectedWordIndex !== index) {
                const wordSpans = sentenceContainer.querySelectorAll('.word');
                const previouslySelected = wordSpans[selectedWordIndex];
                 if (previouslySelected) {
                    previouslySelected.classList.remove('bg-yellow-300/80', 'hover:bg-yellow-400/80');
                    previouslySelected.classList.add('hover:bg-slate-200');
                    previouslySelected.setAttribute('aria-pressed', 'false');
                }
            }

            // Select the new word
            selectedWordIndex = index;
            const wordSpans = sentenceContainer.querySelectorAll('.word');
            const currentWordSpan = wordSpans[index];
            if (currentWordSpan) {
                 currentWordSpan.classList.remove('hover:bg-slate-200');
                 currentWordSpan.classList.add('bg-yellow-300/80', 'hover:bg-yellow-400/80'); // #FACC15 pending highlight
                 currentWordSpan.setAttribute('aria-pressed', 'true');
            }

            showAnswerBtn.disabled = false;
            showAnswerBtn.removeAttribute('aria-disabled');
            announceFeedback(`Selected word: ${wordText}`);
        }

        function handleShowAnswer() {
            if (selectedWordIndex === null || isRevealed) return;

            isRevealed = true;
            showAnswerBtn.disabled = true;
            showAnswerBtn.setAttribute('aria-disabled', 'true');
            showAnswerBtn.classList.add('hidden'); // Hide button after use

            const wordSpans = sentenceContainer.querySelectorAll('.word');
            const isCorrectSelection = selectedWordIndex === currentErrorIndex;

            let feedbackMsg = "";

            // Apply styles to words based on correctness
            wordSpans.forEach((span, index) => {
                span.classList.remove('cursor-pointer', 'hover:bg-slate-200', 'hover:bg-yellow-400/80', 'bg-yellow-300/80');
                span.classList.add('cursor-default');
                span.removeAttribute('tabindex'); // Remove from tab order
                 span.setAttribute('aria-pressed', 'false'); // Reset aria-pressed

                if (index === selectedWordIndex) {
                    if (isCorrectSelection) {
                        span.classList.add('bg-green-600', 'text-white', 'ring-2', 'ring-green-700', 'ring-offset-1'); // #16A34A Correct
                    } else {
                        span.classList.add('bg-red-600', 'text-white', 'ring-2', 'ring-red-700', 'ring-offset-1'); // #DC2626 Wrong
                    }
                } else if (index === currentErrorIndex) {
                    // Highlight the actual error if the user missed it
                    span.classList.add('bg-green-600/90', 'text-white', 'underline', 'decoration-wavy', 'decoration-white/80'); // #16A34A Actual Error
                } else {
                    // Fade out non-essential words
                     span.classList.add('text-slate-500');
                }
                 // Ensure no lingering focus styles interfere
                 span.classList.remove('focus:ring-blue-500');
                 span.style.outline = 'none'; // Force remove focus outline after reveal
            });

            // Prepare and show answer details section
            answerDetails.classList.remove('hidden', 'text-green-700', 'text-red-700'); // Reset classes
            if (isCorrectSelection) {
                answerStatus.textContent = '✅ Correct!';
                answerDetails.classList.add('text-green-700'); // Use text color for overall tone
                feedbackMsg = `Correct! The error was "${words[currentErrorIndex]}". Correction: "${currentCorrection}". Rule: ${currentRule}.`;
            } else {
                answerStatus.textContent = '❌ Incorrect';
                answerDetails.classList.add('text-red-700');
                cardElement.classList.add('animate-shake'); // Trigger shake animation
                setTimeout(() => cardElement.classList.remove('animate-shake'), 400); // Remove class after animation
                feedbackMsg = `Incorrect. You selected "${words[selectedWordIndex]}". The error was "${words[currentErrorIndex]}". Correction: "${currentCorrection}". Rule: ${currentRule}.`;
            }

            answerText.innerHTML = `The error was <strong class="font-medium">"${words[currentErrorIndex]}"</strong>. It should be <strong class="font-medium">"${currentCorrection}"</strong>.`;
            answerRule.textContent = `Rule: ${currentRule}`;
            answerDetails.classList.remove('hidden');
            answerDetails.setAttribute('aria-hidden', 'false');

            announceFeedback(feedbackMsg);

            // Setup "Next" functionality
            if (currentOnNext) {
                nextPrompt.classList.remove('hidden');
                cardElement.classList.add('cursor-pointer', 'hover:shadow-lg');
                // Add listener ONCE
                cardElement.addEventListener('click', handleCardClickForNext, { once: true });
                 cardElement.addEventListener('keydown', handleCardKeydownForNext, { once: true });
                 cardElement.setAttribute('tabindex', '0'); // Make card focusable for keyboard 'next'
                 cardElement.focus(); // Focus card to hint keyboard user
            }
        }

        function handleCardClickForNext(event) {
            // Prevent clicks on words/buttons inside triggering this after reveal
             if (event.target !== cardElement && !cardElement.contains(event.target)) {
                 return;
             }
             if (isRevealed && currentOnNext) {
                 // Cleanup card styles/listeners before calling onNext
                 cardElement.classList.remove('cursor-pointer', 'hover:shadow-lg');
                 cardElement.removeAttribute('tabindex');
                 cardElement.removeEventListener('keydown', handleCardKeydownForNext);
                 currentOnNext();
             }
        }

         function handleCardKeydownForNext(event) {
             if (isRevealed && currentOnNext && (event.key === 'Enter' || event.key === ' ')) {
                 event.preventDefault(); // Prevent default space scrolling
                 handleCardClickForNext(event); // Reuse click logic
             }
         }

        function initCard(data) {
            // Reset state
            selectedWordIndex = null;
            isRevealed = false;
            words = data.sentence.split(' ');
            currentErrorIndex = data.errorIndex;
            currentCorrection = data.correction;
            currentRule = data.rule;
            currentOnNext = data.onNext || null; // Store the callback

            // Clear previous content and styles
            sentenceContainer.innerHTML = '';
            showAnswerBtn.disabled = true;
            showAnswerBtn.setAttribute('aria-disabled', 'true');
            showAnswerBtn.classList.remove('hidden');
            answerDetails.classList.add('hidden');
            answerDetails.setAttribute('aria-hidden', 'true');
            answerStatus.textContent = '';
            answerText.textContent = '';
            answerRule.textContent = '';
            nextPrompt.classList.add('hidden');
            cardElement.classList.remove('cursor-pointer', 'hover:shadow-lg', 'animate-shake');
            cardElement.removeAttribute('tabindex');
            // Remove potential lingering event listeners from previous card instance
            cardElement.removeEventListener('click', handleCardClickForNext);
            cardElement.removeEventListener('keydown', handleCardKeydownForNext);

            // Build sentence words
            words.forEach((word, index) => {
                const wordSpan = document.createElement('span');
                wordSpan.textContent = word;
                wordSpan.dataset.index = index;
                wordSpan.classList.add(
                    'word', // Marker class
                    'inline-block', 'rounded', 'py-1', 'px-2', 'm-0.5', // Base style
                    'cursor-pointer', 'transition-colors', 'duration-150', // Interactive style
                    'min-h-[44px]', 'min-w-[30px]', // Min tap target
                    'flex', 'items-center', 'justify-center', // Alignment within span
                    'hover:bg-slate-200', // Default hover
                    'focus:outline-none' // Remove default outline, handled by focus-visible style
                );
                wordSpan.setAttribute('role', 'button'); // Semantics for span acting as button
                wordSpan.setAttribute('tabindex', '0'); // Make it focusable
                wordSpan.setAttribute('aria-pressed', 'false'); // Initial state

                wordSpan.addEventListener('click', () => handleWordInteraction(index, word));
                wordSpan.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault(); // Prevent space scroll/activate button
                        handleWordInteraction(index, word);
                    }
                });

                sentenceContainer.appendChild(wordSpan);
                // Add space between words visually (can also be done with margin)
                sentenceContainer.appendChild(document.createTextNode(' '));
            });

            // Clear initial feedback
            announceFeedback("New card loaded. Select the incorrect word.");
        }

        // --- Event Listeners ---
        showAnswerBtn.addEventListener('click', handleShowAnswer);

        // Global listener for Escape key to deselect
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                deselectWord();
            }
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            initCard(cardData);
        });

    </script>

</body>
</html>
