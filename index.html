<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Spot Error Quiz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <style type="text/tailwindcss">
        @layer utilities {
          .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
          }
        }
        /* Shake Animation */
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
          20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
          animation: shake 0.4s ease-in-out;
        }
        /* Focus style for word spans */
        .word:focus-visible {
            outline: 2px solid #3b82f6; /* blue-500 */
            outline-offset: 2px;
            background-color: #e0f2fe; /* sky-100 */
        }
        /* Progress bar fill transition */
        #progress-bar-fill {
            transition: width 0.3s ease-out;
        }
        /* Subtle fade transition for card content changes */
        #grammar-card {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #grammar-card.loading {
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
    <script>
      // Tailwind Config (optional, defines color names)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: 'hsl(222.2 47.4% 11.2%)',
                foreground: 'hsl(210 40% 98%)',
              },
              'feedback-correct': '#16A34A', // green-600
              'feedback-wrong': '#DC2626',   // red-600
              'feedback-pending': '#FACC15', // yellow-400
              'card-bg': '#F8FAFC',          // slate-50
              'progress-fill': '#22C55E',    // green-500
              'progress-track': '#E5E7EB',   // gray-200
            },
          }
        }
      }
    </script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div class="w-full max-w-md mb-6 text-center">
        <h1 class="text-2xl font-bold text-slate-800 mb-4">Grammar Spot-the-Error</h1>

        <!-- Progress Bar Area -->
        <div id="progress-container" class="w-full mb-2">
             <span id="progress-label" class="text-sm text-slate-600 mb-1 block">Card 1 of N</span>
             <div role="progressbar"
                  aria-labelledby="progress-label"
                  aria-valuenow="0"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  class="w-full bg-progress-track rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar-fill" class="bg-progress-fill h-2.5 rounded-full" style="width: 0%"></div>
             </div>
        </div>
    </div>

    <!-- Grammar Card Container -->
    <div id="grammar-card"
         class="bg-card-bg rounded-2xl shadow-md p-4 w-full max-w-md mx-auto flex flex-col gap-4"
         role="group"
         aria-labelledby="sentence-heading"
         aria-live="polite"  
         aria-atomic="true"> {/* Card itself can announce loading state */}

        <!-- Screen Reader Only Heading (context for content within card) -->
        <h2 id="sentence-heading" class="sr-only">Current grammar card</h2>

        <div id="card-content">
            <!-- Content replaced dynamically -->
            <div class="text-center text-slate-500">Loading...</div>
        </div>

        <!-- ARIA Live Region for Specific Feedback (moved outside dynamic content) -->
        <div id="sr-feedback" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>

    <!-- Quiz Complete Message Area (Initially Hidden) -->
    <div id="quiz-complete" class="hidden mt-6 text-center w-full max-w-md">
        <h2 class="text-xl font-semibold text-slate-700">Quiz Complete!</h2>
        <p class="text-slate-600 mt-2">Well done!</p>
        <!-- Optional: Add a button to restart or go elsewhere -->
    </div>


    <script>
        // --- Card Deck ---
        const cardDeck = [
          { id: 1, sentence: "My cousins is coming tomorrow.", errorIndex: 2, correction: "are", rule: "plural subject → plural verb" },
          { id: 2, sentence: "He swim very fast.", errorIndex: 1, correction: "swims", rule: "present simple, 3rd person singular → add 's'" },
          { id: 3, sentence: "She go to the library yesterday.", errorIndex: 1, correction: "went", rule: "action in the past → simple past tense" },
          { id: 4, sentence: "The cat jump onto the table.", errorIndex: 1, correction: "jumped", rule: "action in the past → simple past tense" },
          { id: 5, sentence: "We has finished our homework.", errorIndex: 1, correction: "have", rule: "plural subject → plural auxiliary verb" },
        ];
        const totalCards = cardDeck.length;

        // --- DOM Element References ---
        const cardElement = document.getElementById('grammar-card');
        const cardContentElement = document.getElementById('card-content');
        const srFeedback = document.getElementById('sr-feedback');
        const progressContainer = document.getElementById('progress-container');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressLabel = document.getElementById('progress-label');
        const progressBar = progressContainer.querySelector('[role="progressbar"]');
        const quizCompleteElement = document.getElementById('quiz-complete');

        // --- State Variables ---
        let currentCardIndex = -1; // Start before the first card
        let currentCardData = null;
        let words = [];
        let selectedWordIndex = null;
        let isRevealed = false;
        let isLoading = false; // To prevent interactions during transitions

        // --- Constants ---
        const CORRECT_ANSWER_DELAY_MS = 700; // 0.7 seconds

        // --- Functions ---

        function announceFeedback(message, isPriority = false) {
            // Use card's aria-live for general state, srFeedback for specific actions
            if (isPriority) {
                // Use the dedicated region for immediate feedback
                 srFeedback.textContent = '';
                 setTimeout(() => { srFeedback.textContent = message; }, 50);
            } else {
                // Announce general state changes via the card itself
                // (e.g., "Card 2 of 5 loaded.")
                cardElement.textContent = message; // Screen readers read this change due to aria-live
                // Restore actual card content immediately after announcement paints
                requestAnimationFrame(() => {
                     renderCardContent(currentCardData);
                });
            }
        }

        function deselectWord() {
            if (selectedWordIndex !== null && !isRevealed && !isLoading) {
                const wordSpans = cardContentElement.querySelectorAll('.word');
                if (wordSpans.length > selectedWordIndex && wordSpans[selectedWordIndex]) {
                    const previouslySelected = wordSpans[selectedWordIndex];
                    previouslySelected.classList.remove('bg-yellow-300/80', 'hover:bg-yellow-400/80');
                    previouslySelected.classList.add('hover:bg-slate-200');
                    previouslySelected.setAttribute('aria-pressed', 'false');
                }
                selectedWordIndex = null;
                const showAnswerBtn = cardContentElement.querySelector('#show-answer-btn');
                if(showAnswerBtn) {
                    showAnswerBtn.disabled = true;
                    showAnswerBtn.setAttribute('aria-disabled', 'true');
                }
                announceFeedback('Selection cleared.', true);
            }
        }

        function handleWordInteraction(index, wordText) {
            if (isRevealed || isLoading) return;

            // Deselect previous word if any
            const wordSpans = cardContentElement.querySelectorAll('.word');
            if (selectedWordIndex !== null && selectedWordIndex !== index) {
                 if (wordSpans.length > selectedWordIndex && wordSpans[selectedWordIndex]) {
                     const previouslySelected = wordSpans[selectedWordIndex];
                    previouslySelected.classList.remove('bg-yellow-300/80', 'hover:bg-yellow-400/80');
                    previouslySelected.classList.add('hover:bg-slate-200');
                    previouslySelected.setAttribute('aria-pressed', 'false');
                 }
            }

            // Select the new word
            selectedWordIndex = index;
            if (wordSpans.length > index && wordSpans[index]) {
                 const currentWordSpan = wordSpans[index];
                 currentWordSpan.classList.remove('hover:bg-slate-200');
                 currentWordSpan.classList.add('bg-yellow-300/80', 'hover:bg-yellow-400/80'); // Pending highlight
                 currentWordSpan.setAttribute('aria-pressed', 'true');
            }

            const showAnswerBtn = cardContentElement.querySelector('#show-answer-btn');
             if(showAnswerBtn) {
                 showAnswerBtn.disabled = false;
                 showAnswerBtn.removeAttribute('aria-disabled');
             }
            announceFeedback(`Selected word: ${wordText}`, true);
        }

        function handleShowAnswer() {
            if (selectedWordIndex === null || isRevealed || isLoading) return;

            isRevealed = true;
            isLoading = true; // Prevent further interaction during feedback/transition
            const showAnswerBtn = cardContentElement.querySelector('#show-answer-btn');
            if (showAnswerBtn) {
                showAnswerBtn.disabled = true;
                showAnswerBtn.setAttribute('aria-disabled', 'true');
                showAnswerBtn.classList.add('opacity-0', 'pointer-events-none'); // Fade out button
            }

            const wordSpans = cardContentElement.querySelectorAll('.word');
            const isCorrectSelection = selectedWordIndex === currentCardData.errorIndex;
            const answerDetailsElement = cardContentElement.querySelector('#answer-details');
            const answerStatusElement = cardContentElement.querySelector('#answer-status');
            const answerTextElement = cardContentElement.querySelector('#answer-text');
            const answerRuleElement = cardContentElement.querySelector('#answer-rule');
            const nextPromptElement = cardContentElement.querySelector('#next-prompt');

            let feedbackMsg = "";

            // Disable further word interaction and apply final styles
            wordSpans.forEach((span, index) => {
                span.classList.remove('cursor-pointer', 'hover:bg-slate-200', 'hover:bg-yellow-400/80', 'bg-yellow-300/80');
                span.classList.add('cursor-default');
                span.removeAttribute('tabindex');
                span.setAttribute('aria-pressed', 'false'); // Reset aria-pressed

                if (index === selectedWordIndex) {
                    span.classList.add(
                        isCorrectSelection ? 'bg-feedback-correct' : 'bg-feedback-wrong',
                        'text-white', 'ring-2',
                        isCorrectSelection ? 'ring-green-700' : 'ring-red-700',
                         'ring-offset-1'
                    );
                } else if (index === currentCardData.errorIndex) {
                    span.classList.add('bg-green-600/90', 'text-white', 'underline', 'decoration-wavy', 'decoration-white/80');
                } else {
                    span.classList.add('text-slate-500', 'opacity-70'); // Fade out others
                }
                span.classList.remove('focus:ring-blue-500');
                span.style.outline = 'none';
            });

             // --- Prepare feedback content ---
            answerTextElement.innerHTML = `The error was <strong class="font-medium">"${words[currentCardData.errorIndex]}"</strong>. It should be <strong class="font-medium">"${currentCardData.correction}"</strong>.`;
            answerRuleElement.textContent = `Rule: ${currentCardData.rule}`;

            // --- Show feedback ---
            answerDetailsElement.classList.remove('hidden', 'text-feedback-correct', 'text-feedback-wrong', 'opacity-0');
            answerDetailsElement.classList.add('transition-opacity', 'duration-300', 'opacity-100');

            if (isCorrectSelection) {
                answerStatusElement.textContent = '✅ Correct!';
                answerDetailsElement.classList.add('text-feedback-correct');
                feedbackMsg = `Correct! The error was "${words[currentCardData.errorIndex]}". Correction: "${currentCardData.correction}". Rule: ${currentCardData.rule}. Moving to next card.`;

                announceFeedback(feedbackMsg, true);
                // AUTOMATIC ADVANCE after delay
                setTimeout(loadNextCard, CORRECT_ANSWER_DELAY_MS);

            } else {
                answerStatusElement.textContent = '❌ Incorrect';
                answerDetailsElement.classList.add('text-feedback-wrong');
                cardElement.classList.add('animate-shake');
                setTimeout(() => cardElement.classList.remove('animate-shake'), 400);
                feedbackMsg = `Incorrect. You selected "${words[selectedWordIndex]}". The error was "${words[currentCardData.errorIndex]}". Correction: "${currentCardData.correction}". Rule: ${currentCardData.rule}.`;

                announceFeedback(feedbackMsg, true);
                // Require user interaction to proceed
                 nextPromptElement.classList.remove('hidden');
                 cardElement.classList.add('cursor-pointer', 'hover:shadow-lg');
                 cardElement.setAttribute('tabindex', '0'); // Make focusable for keyboard next
                 cardElement.focus(); // Hint for keyboard users

                 // Add listeners for 'next' on incorrect
                 cardElement.addEventListener('click', handleCardClickForNext, { once: true });
                 cardElement.addEventListener('keydown', handleCardKeydownForNext, { once: true });
                 isLoading = false; // Allow interaction for 'next'
            }
        }

         function handleCardClickForNext(event) {
             // Prevent clicks on inner elements triggering this accidentally
             if (event.target !== cardElement && !cardElement.contains(event.target)) {
                 return;
             }
             if (isRevealed && !isLoading) { // Ensure we only proceed if revealed and not already loading
                cleanupCardInteractionForNext();
                loadNextCard();
             }
         }

          function handleCardKeydownForNext(event) {
             if (isRevealed && !isLoading && (event.key === 'Enter' || event.key === ' ')) {
                 event.preventDefault();
                 cleanupCardInteractionForNext();
                 loadNextCard();
             }
          }

         function cleanupCardInteractionForNext() {
              cardElement.classList.remove('cursor-pointer', 'hover:shadow-lg');
              cardElement.removeAttribute('tabindex');
              cardElement.removeEventListener('click', handleCardClickForNext);
              cardElement.removeEventListener('keydown', handleCardKeydownForNext);
         }


        function updateProgressBar() {
            const currentCardNum = currentCardIndex + 1;
            const percentage = totalCards > 0 ? (currentCardNum / totalCards) * 100 : 0;

            progressLabel.textContent = `Card ${currentCardNum} of ${totalCards}`;
            progressBarFill.style.width = `${percentage}%`;
            progressBar.setAttribute('aria-valuenow', percentage.toFixed(0));
        }

        function renderCardContent(data) {
            // Clear previous content inside card-content div
            cardContentElement.innerHTML = '';

            // Build sentence words
            const sentenceContainer = document.createElement('div');
            sentenceContainer.id = 'sentence-container';
            sentenceContainer.className = 'text-lg leading-relaxed text-slate-800 text-center mb-4'; // Added mb-4

            words = data.sentence.split(' ');
            words.forEach((word, index) => {
                const wordSpan = document.createElement('span');
                wordSpan.textContent = word;
                wordSpan.dataset.index = index;
                wordSpan.className = 'word inline-block rounded py-1 px-2 m-0.5 cursor-pointer transition-colors duration-150 min-h-[44px] min-w-[30px] flex items-center justify-center hover:bg-slate-200 focus:outline-none';
                wordSpan.setAttribute('role', 'button');
                wordSpan.setAttribute('tabindex', '0');
                wordSpan.setAttribute('aria-pressed', 'false');

                wordSpan.addEventListener('click', () => handleWordInteraction(index, word));
                wordSpan.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        handleWordInteraction(index, word);
                    }
                });
                sentenceContainer.appendChild(wordSpan);
                sentenceContainer.appendChild(document.createTextNode(' ')); // Space between words
            });
            cardContentElement.appendChild(sentenceContainer);

            // Build Action Button Area
            const buttonArea = document.createElement('div');
            buttonArea.className = 'flex justify-center mt-2';
            buttonArea.innerHTML = `
                <button id="show-answer-btn" type="button" disabled
                        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
                        aria-controls="answer-details" aria-disabled="true">
                    Show Answer
                </button>
            `;
            // Re-add listener for the new button (if needed, but handleShowAnswer finds it)
            buttonArea.querySelector('#show-answer-btn').addEventListener('click', handleShowAnswer);
            cardContentElement.appendChild(buttonArea);


            // Build Revealed Answer Section (Initially Hidden)
            const answerSection = document.createElement('div');
            answerSection.id = 'answer-details';
            answerSection.className = 'mt-4 pt-4 border-t border-slate-200 text-center text-sm hidden opacity-0'; // Start hidden and faded out
            answerSection.setAttribute('aria-hidden', 'true');
            answerSection.innerHTML = `
                <p id="answer-status" class="font-semibold text-base mb-1"></p>
                <p id="answer-text" class="mb-1"></p>
                <p id="answer-rule" class="text-slate-600 italic"></p>
                <p id="next-prompt" class="mt-3 text-xs text-slate-500 hidden">Tap anywhere on the card to continue.</p>
            `;
            cardContentElement.appendChild(answerSection);

        }

        function loadNextCard() {
            isLoading = true;
            currentCardIndex++;

            // Add loading visual state (fade out old card)
             cardElement.classList.add('loading');
             // Remove listeners for 'next' if they were added (incorrect answer path)
             cleanupCardInteractionForNext();

             // Use setTimeout to allow fade-out transition before content update/fade-in
             setTimeout(() => {
                 if (currentCardIndex < totalCards) {
                     currentCardData = cardDeck[currentCardIndex];
                     initCard(currentCardData);
                     updateProgressBar();
                     // Announce new card loaded (will restore content via renderCardContent)
                     announceFeedback(`Card ${currentCardIndex + 1} of ${totalCards}. ${currentCardData.sentence}`, false);
                     // Fade in new card
                     requestAnimationFrame(() => { // Ensure DOM is updated before removing class
                         cardElement.classList.remove('loading');
                     });
                 } else {
                     showCompletionScreen();
                 }
                 isLoading = false;
             }, 300); // Match CSS transition duration
        }

        function initCard(data) {
            // Reset state for the new card
            selectedWordIndex = null;
            isRevealed = false;
            currentCardData = data; // Ensure currentCardData is set

             // Render the HTML content for the card
             renderCardContent(data);

            // Reset button state visually (renderCardContent sets initial disabled)
            const showAnswerBtn = cardContentElement.querySelector('#show-answer-btn');
             if(showAnswerBtn) {
                 showAnswerBtn.disabled = true;
                 showAnswerBtn.setAttribute('aria-disabled', 'true');
                 showAnswerBtn.classList.remove('opacity-0', 'pointer-events-none'); // Make sure it's visible
             }

            // Reset card styles/attributes from potential previous incorrect state
             cardElement.classList.remove('cursor-pointer', 'hover:shadow-lg', 'animate-shake');
             cardElement.removeAttribute('tabindex');
        }

        function showCompletionScreen() {
            cardElement.classList.add('hidden');
            progressContainer.classList.add('hidden');
            quizCompleteElement.classList.remove('hidden');
            announceFeedback("Quiz complete!", true);
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            progressBar.setAttribute('aria-valuemax', totalCards);
            loadNextCard(); // Load the first card
        });

        // Global listener for Escape key to deselect
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                deselectWord();
            }
        });

    </script>

</body>
</html>
